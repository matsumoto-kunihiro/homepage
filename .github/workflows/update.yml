# =============================================================
#  情報の自動更新 ＆ ホームページの公開
#  ・日本時間 6:00 / 12:00 / 18:00 ごろ、酒田市HP・マチイロ・まいぷれ酒田 の
#    情報を取り込んでページを更新します（GitHubの混雑で数十分遅れることがあります）
#  ・config.js や写真を書き換えたときも、自動でページに反映されます
# =============================================================
name: 情報の自動更新と公開

on:
  schedule:
    - cron: '0 21 * * *'   # 日本時間 6:00
    - cron: '0 3 * * *'    # 日本時間 12:00
    - cron: '0 9 * * *'    # 日本時間 18:00
  push:
    branches: [main]
  workflow_dispatch:        # 「Run workflow」ボタンで手動実行もできます

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 情報を取り込む
        if: github.event_name != 'push'
        continue-on-error: true   # 取り込みに失敗しても前回の情報でページは公開する
        run: node scripts/update.mjs

      - name: 取り込んだ情報を保存する
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "情報を自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js config.js images data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
